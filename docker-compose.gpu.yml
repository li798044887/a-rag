# 本番(CUDA/GPU)用 overlay。
# 使い方:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile worker up -d --build
#
# 本番では web↔rag 内部認証を必ず差し替える。同一シェルで export しておけば
# web(.env.local) と rag/worker(${RAG_INTERNAL_TOKEN} 展開)へ同じ値が届く:
#   export APP_ENV=production
#   export RAG_INTERNAL_TOKEN="$(openssl rand -hex 32)"
# APP_ENV=production のとき RAG_INTERNAL_TOKEN が dev 既定のままなら rag は起動を拒否する。
#
# GPU 割当は deploy.resources.reservations.devices で記述する。
# トップレベルの `gpus: all` は Compose v2.30+ が必要なため、v2.28 系でも
# 動くこの後方互換構文を使う（`docker compose up` でも device 予約は有効）。
#
# モデル供給元は MINERU_MODEL_SOURCE で切替（既定は MinerU 標準の huggingface）。
# huggingface.co の LFS 配信が不安定/到達不可な環境では、起動時に
#   MINERU_MODEL_SOURCE=modelscope docker compose -f ... -f docker-compose.gpu.yml up -d
# とすれば MinerU(VLM) を ModelScope から取得・キャッシュ運用できる。
# VLM(MinerU2.5) は常駐 vllm サーバ(mineru-vllm)へ集約し、rag/worker はそこへ
# HTTP 接続する薄いクライアント(hybrid-http-client)になる。これにより各 ingest が
# worker 内で vllm を cold 起動して ~12GB を奪い合い OOM する問題を解消する。
# VRAM 予算はサーバ側の --gpu-memory-utilization で一元的に固定する。
# 大判の画像入り PDF は MINERU_PAGE_WINDOW でページ分割し、クライアント側の
# ラスタライズによるホスト RAM 枯渇を頭打ちにする。
services:
  mineru-vllm:
    build:
      context: ./rag
      args:
        VARIANT: gpu
    # MinerU(VLM) を OpenAI 互換 vllm サーバとして 1 プロセスだけ常駐させる。
    # --gpu-memory-utilization で VRAM 予算を固定（24GB の約 40% ≒ 9.6GB）。残りは
    # rag/worker の embedder+reranker が使う。OOM するなら下げ、余れば上げる。
    command: ["mineru-vllm-server", "--host", "0.0.0.0", "--port", "30000",
              "--gpu-memory-utilization", "0.40"]
    environment:
      MINERU_DEVICE_MODE: cuda
      # VLM 重みの供給元。modelcache に取得済みなら HF_HUB_OFFLINE=1 でオフライン運用可。
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-huggingface}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - "modelcache:/root/.cache"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:30000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s

  rag:
    build:
      context: ./rag
      args:
        VARIANT: gpu
    environment:
      DEVICE: cuda
      MINERU_BACKEND: hybrid-http-client
      MINERU_SERVER_URL: http://mineru-vllm:30000
      MINERU_DEVICE_MODE: cuda
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-huggingface}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  rag-worker:
    build:
      context: ./rag
      args:
        VARIANT: gpu
    environment:
      DEVICE: cuda
      MINERU_BACKEND: hybrid-http-client
      MINERU_SERVER_URL: http://mineru-vllm:30000
      MINERU_DEVICE_MODE: cuda
      # PDF をこのページ数ごとに分割解析してピーク RAM を抑える。
      MINERU_PAGE_WINDOW: ${MINERU_PAGE_WINDOW:-40}
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-huggingface}
    depends_on:
      mineru-vllm:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
