name: rag-eval-full

# 既定オフ。手動 or 夜間のみ（実 BGE-M3 + Qdrant + HF キャッシュが必要なため
# GitHub-hosted では原則セルフホストランナー前提）。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"  # 03:00 JST

jobs:
  full-eval:
    runs-on: [self-hosted, Windows, rag]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - name: Prepare report directory
        run: New-Item -ItemType Directory -Force -Path artifacts/rag-eval | Out-Null
      - name: Bring up full stack (rebuild rag to bake eval/)
        run: docker compose --profile worker up -d --build rag
      - name: Ingest golden documents
        run: docker compose exec -T rag uv run python -m eval ingest
      - name: Run evaluation with gate
        run: |
          docker compose exec -T rag uv run python -m eval run `
            --gate --baseline eval/baselines/agentic_rag.json `
            --out /data/eval-reports/eval-report.json `
            2>&1 | Tee-Object -FilePath artifacts/rag-eval/eval-report.md
          exit $LASTEXITCODE
      - name: Publish report summary
        if: always()
        run: |
          if (Test-Path artifacts/rag-eval/eval-report.md) {
            Get-Content artifacts/rag-eval/eval-report.md | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: artifacts/rag-eval/*
