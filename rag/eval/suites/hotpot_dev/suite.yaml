suite: hotpot_dev
adapter: hotpot
split: dev
# 公式 CMU ホスト(curtis.ml.cmu.edu)は死んでいるため、HF parquet から元スキーマへ変換した
# 先頭200問を repo 同梱（HF 非依存・オフライン可・CI 高速化）。全件で回したい場合のみ
# source_url を使う（公式ホストは不安定なので非推奨）。
source_path: hotpot_dev_distractor_sample.json.gz
owner_user_id: __eval_hotpot_dev__
# 0 = 同梱サンプル全 200 問（baseline と再現一致させるためフルセットで回す）
query_limit: 0
# gate は single-hop レポートに対して効く（multi-hop は CI では非 gate の比較実行）。
# 2026-06-08 実測 recall@5=0.938 / fact_coverage=0.956 ベースに引き上げ。
thresholds:
  recall_at_5: 0.85
  fact_coverage: 0.90
