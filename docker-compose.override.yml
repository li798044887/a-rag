# ローカル環境調整用オーバーライド（docker compose が自動マージ）。
# 他プロジェクト (upfront-ufw-tougou) が host:5432 を使うため、a-rag の
# Postgres は host 側を 5433 にずらす。コンテナ内部は 5432 のままなので、
# rag / rag-worker / コンテナ内マイグレーションは変更不要。
# host から接続する web (pnpm dev) と drizzle-kit のみ 5433 を指す。
services:
  postgres:
    # !override で base の ports リストを「追記」ではなく「置換」する。
    # これを付けないと 5432 と 5433 が両方公開され、衝突回避にならない。
    ports: !override
      - "5433:5432"
