<!-- アプリでは next/font が --font-plex-sans / --font-noto-cjk / --font-plex-mono を注入する。
     Storybook では next/font が使えないため Google Fonts から読み込み、同名の CSS 変数を定義して
     globals.css の var(--font-sans) 等を満たす。CJK は本番では Noto Sans CJK 可変フル版（locl で
     日中字形を自動切替）だが、Storybook では近似として Google の Noto Sans JP を当てる。 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --font-plex-sans: "IBM Plex Sans";
    --font-plex-mono: "IBM Plex Mono";
    --font-noto-cjk: "Noto Sans JP";
  }
</style>
