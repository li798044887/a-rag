<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM Observatory</title>
    <style>
      body { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; display: grid; grid-template-columns: 420px 1fr; height: 100vh; color: #1a1a1a; }
      .left { padding: 12px; border-right: 1px solid #ccc; overflow: auto; }
      .right { padding: 12px; overflow: auto; background: #fafafa; }
      h4 { margin: 14px 0 6px; }
      textarea { width: 100%; min-height: 80px; font: inherit; box-sizing: border-box; }
      input, select, button { font: inherit; }
      .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
      .trace { border: 1px solid #ddd; border-radius: 6px; margin: 8px 0; padding: 8px; background: #fff; }
      .badge { background: #c0562b; color: #fff; border-radius: 4px; padding: 0 5px; font-size: 11px; }
      .role { font-weight: 700; }
      pre { white-space: pre-wrap; word-break: break-word; background: #f3f3f3; padding: 6px; border-radius: 4px; margin: 4px 0; max-height: 320px; overflow: auto; }
      details summary { cursor: pointer; user-select: none; }
      .err { color: #b00; }
      small { color: #777; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/ui/main.tsx"></script>
  </body>
</html>
