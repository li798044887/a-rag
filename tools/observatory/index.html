<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM Observatory</title>
    <style>
      :root {
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --bg: #f6f7f9; --panel: #fff; --line: #e3e6ea; --ink: #1c2024; --muted: #6b7280;
        --accent: #c0562b; --chat: #2563eb; --tool: #7c3aed; --ok: #15803d; --err: #b91c1c;
      }
      * { box-sizing: border-box; }
      body { font-family: var(--sans); font-size: 13px; line-height: 1.55; margin: 0; color: var(--ink);
             display: grid; grid-template-columns: 360px 1fr; height: 100vh; background: var(--bg); }
      .left { padding: 14px; border-right: 1px solid var(--line); overflow: auto; background: var(--panel); }
      .right { padding: 16px; overflow: auto; }
      h4 { margin: 16px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
      h4:first-child { margin-top: 0; }
      label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
      input, select, textarea, button { font-family: var(--sans); font-size: 13px; }
      input, select, textarea { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
      textarea { font-family: var(--mono); font-size: 12px; min-height: 90px; resize: vertical; }
      .row { display: flex; gap: 8px; margin: 8px 0; align-items: flex-end; }
      button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
      button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
      button:disabled { opacity: .5; cursor: default; }
      button.link { border: none; background: none; color: var(--accent); padding: 2px 0; }

      .meta { background: #eef1f4; border: 1px solid var(--line); padding: 6px 10px; border-radius: 8px;
              margin-bottom: 12px; font-family: var(--mono); font-size: 12px; word-break: break-all; }

      /* steps tree */
      .steps { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 6px; margin-bottom: 14px; }
      .step { display: flex; align-items: baseline; gap: 8px; padding: 2px 4px; border-radius: 4px; }
      .step:hover { background: #f0f2f5; }
      .step .ico { width: 14px; text-align: center; flex: none; }
      .step .nm { font-family: var(--mono); font-size: 11px; color: var(--ink); font-weight: 600; }
      .step .sum { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .step .ms { color: #9aa1ab; font-size: 11px; font-family: var(--mono); flex: none; }
      .ok { color: var(--ok); } .er { color: var(--err); } .run { color: var(--muted); }

      /* trace card */
      .trace { border: 1px solid var(--line); border-left: 3px solid var(--muted); border-radius: 8px;
               background: var(--panel); padding: 10px 12px; margin-bottom: 10px; }
      .trace.chat { border-left-color: var(--chat); }
      .trace.verify, .trace.grade, .trace.queryRewrite, .trace.revise { border-left-color: var(--tool); }
      .trace.failed { border-left-color: var(--err); }
      .thead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .seq { font-family: var(--mono); color: var(--muted); }
      .role { font-weight: 700; }
      .tok { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); }
      .chip { font-size: 11px; padding: 1px 6px; border-radius: 10px; background: #eceff3; color: #4b5563; }
      .chip.amber { background: #fef3c7; color: #92400e; }
      .chip.blue { background: #dbeafe; color: #1e40af; }
      .chip.red { background: #fee2e2; color: #991b1b; }

      details { margin-top: 6px; }
      summary { cursor: pointer; user-select: none; font-size: 12px; color: #374151; }
      summary:hover { color: var(--ink); }
      pre { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word;
            background: #f3f4f6; border: 1px solid var(--line); border-radius: 6px; padding: 8px;
            margin: 6px 0 0; max-height: 360px; overflow: auto; }
      pre.err { background: #fef2f2; border-color: #fecaca; color: var(--err); }
      pre.reason { background: #f5f3ff; border-color: #ddd6fe; }

      /* markdown answer */
      .md { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
      .md h1,.md h2,.md h3 { font-size: 14px; margin: 10px 0 4px; }
      .md ul { margin: 4px 0; padding-left: 18px; }
      .md p { margin: 6px 0; }
      .md code { font-family: var(--mono); background: #eceff3; padding: 0 3px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/ui/main.tsx"></script>
  </body>
</html>
