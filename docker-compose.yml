services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arag
      POSTGRES_PASSWORD: arag
      POSTGRES_DB: arag
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arag"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

  rag:
    build: ./rag
    environment:
      DATABASE_URL: postgresql+psycopg://arag:arag@postgres:5432/arag
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      DEVICE: cpu
      EMBEDDER: bge-m3
      RERANKER: bge
      RAG_INTERNAL_TOKEN: dev-internal-token
      PRELOAD_MODELS: "1"
      # モデルは modelcache に取得済み。オフライン強制でキャッシュから読み込み、
      # transformers が起動時に huggingface.co を叩く（mistral 判定の model_info）のを防ぐ。
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      EASYOCR_MODEL_DIR: /root/.cache/easyocr/model
    ports: ["8000:8000"]
    # modelcache: BGE-M3 / reranker / MinerU の重みを永続化し rag↔worker で共有
    # （再作成のたびに数 GB を再ダウンロードしない）。
    volumes:
      - "uploads:/data/uploads"
      - "modelcache:/root/.cache"
      - "./rag/eval/assets:/data/repo-eval-assets:ro"
      - "./artifacts/eval-assets:/data/eval-assets"
      - "./artifacts/rag-eval:/data/eval-reports"
      - "./artifacts/eval-cache:/data/eval-cache"
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  rag-worker:
    build: ./rag
    profiles: ["worker"]
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+psycopg://arag:arag@postgres:5432/arag
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      DEVICE: cpu
      EMBEDDER: bge-m3
      RERANKER: bge
      RAG_INTERNAL_TOKEN: dev-internal-token
      # モデルは modelcache に取得済み。オフライン強制でキャッシュから読み込み、
      # transformers が huggingface.co を叩く（mistral 判定の model_info）のを防ぐ。
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      EASYOCR_MODEL_DIR: /root/.cache/easyocr/model
    volumes: ["uploads:/data/uploads", "modelcache:/root/.cache"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
  qdrantdata:
  redisdata:
  uploads:
  modelcache:
